<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Rewards - Arcade Hub</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary-cyan: #38bdf8;
      --primary-emerald: #34d399;
      --premium-gold: #fbbf24;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(52, 211, 153, 0.1) 0px, transparent 50%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: color 0.2s;
    }

    .back-nav:hover {
      color: var(--primary-cyan);
    }

    .reward-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .reward-header {
      text-align: center;
    }

    .reward-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .reward-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 32px;
    }

    .multiplier-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .multiplier-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .multiplier-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .multiplier-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-emerald);
    }

    .tracks-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }

    .track-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      position: relative;
    }

    .track-section.vip-track {
      border-color: rgba(251, 191, 36, 0.3);
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.03) 0%, rgba(15, 23, 42, 0.4) 100%);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .badge-free {
      background: rgba(52, 211, 153, 0.15);
      color: var(--primary-emerald);
    }

    .badge-vip {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #07090e;
    }

    .streak-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .streak-day {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .streak-day.active {
      border-color: var(--primary-cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    .streak-day.completed {
      border-color: var(--primary-emerald);
      background: rgba(52, 211, 153, 0.1);
      color: var(--primary-emerald);
    }

    .vip-track .streak-day.active {
      border-color: var(--premium-gold);
      background: rgba(251, 191, 36, 0.15);
    }

    .vip-track .streak-day.completed {
      border-color: var(--premium-gold);
      background: rgba(251, 191, 36, 0.1);
      color: var(--premium-gold);
    }

    .track-locked-overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 14, 0.75);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }

    .upgrade-link-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #07090e;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 10px;
      transition: transform 0.2s;
    }

    .upgrade-link-btn:hover {
      transform: scale(1.05);
    }

    .day-title {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .day-val {
      font-size: 0.85rem;
      font-weight: 800;
    }

    .claim-action-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-emerald));
      color: #07090e;
      border: none;
      padding: 18px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
    }

    .claim-action-btn.vip-active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    .claim-action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    .claim-action-btn.vip-active:hover:not(:disabled) {
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.35);
    }

    .claim-action-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .streak-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-nav">← Back to Arcade</a>

    <div class="reward-card">
      <div class="reward-header">
        <h1>Daily Vault</h1>
        <p>Log in daily to scale your streak rewards and accumulate Arcade Credits.</p>
      </div>

      <div class="multiplier-box">
        <div class="multiplier-item">
          <span class="multiplier-label">Membership Tier</span>
          <span class="multiplier-val" id="tierText">Free Tier</span>
        </div>
        <div class="multiplier-item">
          <span class="multiplier-label">Daily Bonus Rate</span>
          <span class="multiplier-val" id="bonusText">1.0x</span>
        </div>
        <div class="multiplier-item">
          <span class="multiplier-label">Current Streak</span>
          <span class="multiplier-val" id="streakText">1 Day</span>
        </div>
      </div>

      <div class="tracks-container">
        <div class="track-section">
          <div class="track-header">
            <div class="track-title">Standard Track</div>
            <span class="track-badge badge-free">Free Track</span>
          </div>
          <div class="streak-grid" id="freeStreakGrid"></div>
        </div>

        <div class="track-section vip-track">
          <div class="track-header">
            <div class="track-title" style="color: var(--premium-gold);">👑 VIP Bonus Track</div>
            <span class="track-badge badge-vip">2.5x Multiplier</span>
          </div>
          <div class="streak-grid" id="vipStreakGrid"></div>
          
          <div class="track-locked-overlay" id="vipLockedOverlay">
            🔒 Upgrade to VIP to unlock extra daily rewards!
            <a href="premium.html" class="upgrade-link-btn">Get VIP Pass</a>
          </div>
        </div>
      </div>

      <button class="claim-action-btn" id="claimBtn" onclick="processClaim()">Claim Reward</button>
    </div>
  </div>

  <script>
    const BASE_REWARDS = [50, 75, 100, 150, 200, 300, 500];
    const VIP_MULTIPLIER = 2.5;

    let tokens = parseInt(localStorage.getItem('hubTokens')) || 100;
    let lastClaim = parseInt(localStorage.getItem('hubLastClaim')) || 0;
    let streak = parseInt(localStorage.getItem('hubStreak')) || 0;
    const tier = localStorage.getItem('hubTier') || 'free';
    const isVIP = tier === 'vip';

    function renderRewards() {
      // Set top tier labels
      document.getElementById('tierText').textContent = isVIP ? 'VIP Tier' : 'Free Tier';
      document.getElementById('tierText').style.color = isVIP ? '#fbbf24' : '#34d399';
      document.getElementById('bonusText').textContent = isVIP ? `${VIP_MULTIPLIER}x Rewards` : '1.0x Rewards';
      document.getElementById('streakText').textContent = `${(streak % 7) + 1} / 7 Days`;

      // Show/hide lock overlay for VIP Track
      document.getElementById('vipLockedOverlay').style.display = isVIP ? 'none' : 'flex';

      const freeGrid = document.getElementById('freeStreakGrid');
      const vipGrid = document.getElementById('vipStreakGrid');
      freeGrid.innerHTML = '';
      vipGrid.innerHTML = '';

      const now = Date.now();
      const twentyFourHours = 24 * 60 * 60 * 1000;
      const canClaim = (now - lastClaim) >= twentyFourHours;
      const currentDayIndex = streak % 7;

      BASE_REWARDS.forEach((base, index) => {
        const freeVal = base;
        const vipVal = Math.floor(base * VIP_MULTIPLIER);

        // Build Free Day Element
        const freeDayEl = document.createElement('div');
        freeDayEl.className = 'streak-day';
        if (index < currentDayIndex) freeDayEl.classList.add('completed');
        else if (index === currentDayIndex) freeDayEl.classList.add('active');

        freeDayEl.innerHTML = `
          <span class="day-title">Day ${index + 1}</span>
          <span style="font-size:1.1rem">${index < currentDayIndex ? '✓' : '🪙'}</span>
          <span class="day-val">+${freeVal}</span>
        `;
        freeGrid.appendChild(freeDayEl);

        // Build VIP Day Element
        const vipDayEl = document.createElement('div');
        vipDayEl.className = 'streak-day';
        if (index < currentDayIndex) vipDayEl.classList.add('completed');
        else if (index === currentDayIndex) vipDayEl.classList.add('active');

        vipDayEl.innerHTML = `
          <span class="day-title">Day ${index + 1}</span>
          <span style="font-size:1.1rem">${index < currentDayIndex ? '✓' : '👑'}</span>
          <span class="day-val" style="color: var(--premium-gold)">+${vipVal}</span>
        `;
        vipGrid.appendChild(vipDayEl);
      });

      // Update button visual state
      const btn = document.getElementById('claimBtn');
      if (isVIP) btn.classList.add('vip-active');
      else btn.classList.remove('vip-active');

      if (!canClaim && lastClaim !== 0) {
        btn.disabled = true;
        const remainingHours = Math.ceil((twentyFourHours - (now - lastClaim)) / (1000 * 60 * 60));
        btn.textContent = `Claimed (Next in ${remainingHours}h)`;
      } else {
        btn.disabled = false;
        const rewardAmount = Math.floor(BASE_REWARDS[currentDayIndex] * (isVIP ? VIP_MULTIPLIER : 1.0));
        btn.textContent = `Claim Day ${currentDayIndex + 1} (+${rewardAmount} Credits)`;
      }
    }

    function processClaim() {
      const now = Date.now();
      const fortyEightHours = 48 * 60 * 60 * 1000;

      if (lastClaim !== 0 && (now - lastClaim) > fortyEightHours) {
        streak = 0; // Reset streak if missed more than 48 hours
      }

      const currentDayIndex = streak % 7;
      const multiplier = isVIP ? VIP_MULTIPLIER : 1.0;
      const earned = Math.floor(BASE_REWARDS[currentDayIndex] * multiplier);

      tokens += earned;
      streak += 1;
      lastClaim = now;

      localStorage.setItem('hubTokens', tokens);
      localStorage.setItem('hubLastClaim', lastClaim);
      localStorage.setItem('hubStreak', streak);

      renderRewards();
    }

    renderRewards();
  </script>

<script src="https://static.app/js/static.js" type="text/javascript"></script>
</body>
</html>
