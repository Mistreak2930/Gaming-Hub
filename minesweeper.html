<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minesweeper Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(52, 211, 153, 0.1) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      padding: 30px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .scores-wrapper {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .score-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 24px;
      text-align: center;
      min-width: 120px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .score-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .score-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      width: 100%;
      overflow-x: auto;
    }

    .board {
      display: grid;
      gap: 6px;
      background-color: #090d16;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .cell {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cell:hover:not(.revealed) {
      background-color: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .cell.revealed {
      background-color: #0f172a;
      border-color: rgba(255, 255, 255, 0.03);
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .cell.mine {
      background-color: #ef4444;
      border-color: #f87171;
      animation: pulseMine 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cell.flagged {
      color: #fbbf24;
    }

    @keyframes pulseMine {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Number Colors */
    .c-1 { color: #38bdf8; }
    .c-2 { color: #34d399; }
    .c-3 { color: #f43f5e; }
    .c-4 { color: #a855f7; }
    .c-5 { color: #fbbf24; }
    .c-6 { color: #06b6d4; }
    .c-7 { color: #ec4899; }
    .c-8 { color: #94a3b8; }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      transform: scale(1.05);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #34d399);
      color: #090d16;
      border: none;
      font-weight: 800;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8, #34d399);
      color: #090d16;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .controls-info {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .status-banner {
      margin-bottom: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      min-height: 30px;
      text-align: center;
    }

    .status-win { color: #34d399; }
    .status-lose { color: #f43f5e; }

    .version {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <button class="btn" onclick="history.back()">← Back to Hub</button>
    </div>

    <header>
      <h1>MINESWEEPER</h1>
      <p>Clear the grid without triggering mines.</p>
    </header>

    <div class="scores-wrapper">
      <div class="score-card">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Mines Left</div>
        <div class="score-value" id="mineCount">10</div>
      </div>
      <div class="score-card">
        <div class="score-label">Best</div>
        <div class="score-value" id="highScore">0</div>
      </div>
    </div>

    <div class="game-wrapper">
      <div class="status-banner" id="statusMessage"></div>
      
      <div class="board-container">
        <div id="gameBoard" class="board"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btn-easy" onclick="resetGame('easy')">Easy (8x8)</button>
        <button class="btn" id="btn-medium" onclick="resetGame('medium')">Medium (10x10)</button>
        <button class="btn" id="btn-hard" onclick="resetGame('hard')">Hard (12x12)</button>
      </div>
    </div>

    <div class="controls-info">
      <span><strong>Click:</strong> Reveal &nbsp;|&nbsp; <strong>Right Click:</strong> Flag Mine</span>
      <button class="btn" onclick="resetGame()">Restart</button>
    </div>
  </div>

  <div class="version">v1.5.0</div>

  <script>
    const settings = {
      easy: { rows: 8, cols: 8, mines: 10 },
      medium: { rows: 10, cols: 10, mines: 18 },
      hard: { rows: 12, cols: 12, mines: 30 }
    };

    let currentDifficulty = 'easy';
    let numRows = settings.easy.rows;
    let numCols = settings.easy.cols;
    let numMines = settings.easy.mines;

    const gameBoard = document.getElementById("gameBoard");
    const scoreDisplay = document.getElementById("score");
    const mineCountDisplay = document.getElementById("mineCount");
    const highScoreDisplay = document.getElementById("highScore");
    const statusMessage = document.getElementById("statusMessage");

    let board = [];
    let score = 0;
    let flagsUsed = 0;
    let gameOver = false;
    let firstClick = true;
    
    // Load high score from both standard hub key names
    let highScore = parseInt(localStorage.getItem("minesweeperHighScore") || localStorage.getItem("minesweeper_highscore")) || 0;

    highScoreDisplay.textContent = highScore;

    function saveHighScore() {
      if (score > highScore) {
        highScore = score;
        // Sync score across both localStorage key conventions used by the hub
        localStorage.setItem("minesweeperHighScore", highScore);
        localStorage.setItem("minesweeper_highscore", highScore);
      }
      highScoreDisplay.textContent = highScore;
    }

    function initializeBoard() {
      board = [];
      gameOver = false;
      firstClick = true;
      flagsUsed = 0;
      statusMessage.textContent = "";
      statusMessage.className = "status-banner";

      gameBoard.style.gridTemplateColumns = `repeat(${numCols}, 42px)`;

      for (let i = 0; i < numRows; i++) {
        board[i] = [];
        for (let j = 0; j < numCols; j++) {
          board[i][j] = {
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
        }
      }

      updateMineCounter();
    }

    function placeMines(firstRow, firstCol) {
      let minesPlaced = 0;
      while (minesPlaced < numMines) {
        const row = Math.floor(Math.random() * numRows);
        const col = Math.floor(Math.random() * numCols);

        const isSafeZone = Math.abs(row - firstRow) <= 1 && Math.abs(col - firstCol) <= 1;

        if (!board[row][col].isMine && !isSafeZone) {
          board[row][col].isMine = true;
          minesPlaced++;
        }
      }

      for (let i = 0; i < numRows; i++) {
        for (let j = 0; j < numCols; j++) {
          if (!board[i][j].isMine) {
            let count = 0;
            for (let dx = -1; dx <= 1; dx++) {
              for (let dy = -1; dy <= 1; dy++) {
                const ni = i + dx;
                const nj = j + dy;
                if (
                  ni >= 0 && ni < numRows &&
                  nj >= 0 && nj < numCols &&
                  board[ni][nj].isMine
                ) {
                  count++;
                }
              }
            }
            board[i][j].count = count;
          }
        }
      }
    }

    function revealCell(row, col) {
      if (gameOver) return;
      if (row < 0 || row >= numRows || col < 0 || col >= numCols) return;

      const cellData = board[row][col];
      if (cellData.revealed || cellData.flagged) return;

      if (firstClick) {
        firstClick = false;
        placeMines(row, col);
      }

      cellData.revealed = true;

      if (cellData.isMine) {
        endGame(false);
        return;
      }

      score += 10;
      updateScoreboard();

      if (cellData.count === 0) {
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx !== 0 || dy !== 0) {
              revealCell(row + dx, col + dy);
            }
          }
        }
      }

      checkWin();
      renderBoard();
    }

    function toggleFlag(row, col) {
      if (gameOver || firstClick) return;

      const cellData = board[row][col];
      if (cellData.revealed) return;

      cellData.flagged = !cellData.flagged;
      flagsUsed += cellData.flagged ? 1 : -1;

      if (cellData.flagged) {
        if (cellData.isMine) score += 15;
      } else {
        if (cellData.isMine) score -= 15;
      }

      updateMineCounter();
      updateScoreboard();
      renderBoard();
    }

    function endGame(isWin) {
      gameOver = true;
      
      for (let i = 0; i < numRows; i++) {
        for (let j = 0; j < numCols; j++) {
          if (board[i][j].isMine) {
            board[i][j].revealed = true;
          }
        }
      }

      if (isWin) {
        score += 100;
        updateScoreboard();
        statusMessage.textContent = "🎉 Board Cleared! You Win!";
        statusMessage.className = "status-banner status-win";
      } else {
        statusMessage.textContent = "💥 Game Over! You hit a mine.";
        statusMessage.className = "status-banner status-lose";
      }

      renderBoard();
    }

    function checkWin() {
      let revealedCount = 0;
      for (let i = 0; i < numRows; i++) {
        for (let j = 0; j < numCols; j++) {
          if (board[i][j].revealed) revealedCount++;
        }
      }

      if (revealedCount === numRows * numCols - numMines) {
        endGame(true);
      }
    }

    function updateScoreboard() {
      score = Math.max(0, score);
      scoreDisplay.textContent = score;
      saveHighScore();
    }

    function updateMineCounter() {
      mineCountDisplay.textContent = numMines - flagsUsed;
    }

    function updateActiveButtons(diff) {
      ['easy', 'medium', 'hard'].forEach(d => {
        const btn = document.getElementById(`btn-${d}`);
        if (d === diff) {
          btn.className = 'btn btn-primary';
        } else {
          btn.className = 'btn';
        }
      });
    }

    function resetGame(diff = currentDifficulty) {
      currentDifficulty = diff;
      numRows = settings[diff].rows;
      numCols = settings[diff].cols;
      numMines = settings[diff].mines;

      updateActiveButtons(diff);
      score = 0;
      updateScoreboard();
      initializeBoard();
      renderBoard();
    }

    function renderBoard() {
      gameBoard.innerHTML = "";

      for (let i = 0; i < numRows; i++) {
        for (let j = 0; j < numCols; j++) {
          const cellData = board[i][j];
          const cell = document.createElement("div");
          cell.className = "cell";

          if (cellData.revealed) {
            cell.classList.add("revealed");
            if (cellData.isMine) {
              cell.classList.add("mine");
              cell.textContent = "💣";
            } else if (cellData.count > 0) {
              cell.textContent = cellData.count;
              cell.classList.add(`c-${cellData.count}`);
            }
          } else if (cellData.flagged) {
            cell.classList.add("flagged");
            cell.textContent = "🚩";
          }

          cell.addEventListener("click", () => revealCell(i, j));
          cell.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            toggleFlag(i, j);
          });

          gameBoard.appendChild(cell);
        }
      }
    }

    // Initialize game
    resetGame();
  </script>

<script src="https://static.app/js/static.js" type="text/javascript"></script>
</body>
</html>
