<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Level Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #090d16;
      background-image: 
        radial-gradient(at 50% 30%, rgba(239, 68, 68, 0.15) 0px, transparent 60%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .error-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glitch-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(to right, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.05em;
    }

    .icon-ghost {
      font-size: 4rem;
      margin: 16px 0;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn-home {
      background: linear-gradient(135deg, #38bdf8, #34d399);
      color: #090d16;
      border: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="glitch-code">404</div>
    <div class="icon-ghost">👾</div>
    <h1>GAME OVER</h1>
    <p>The level you are searching for has glitched out or doesn't exist in this realm.</p>
    <a href="index.html" class="btn-home">Return to Main Hub</a>
  </div>


<script src="https://static.app/js/static.js" type="text/javascript"></script>
</body>
</html>
