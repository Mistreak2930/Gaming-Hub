<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Snake - Supabase Edition</title>
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1b;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 4px solid #00ffcc;
      box-shadow: 0 0 20px #00ffcc55;
      border-radius: 8px;
    }
    canvas {
      display: block;
      background: #141423;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }
    .controls-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 27, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      color: #0f0f1b;
      background: #00ffcc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffcc;
      transition: all 0.2s;
    }
    button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
    input[type="text"] {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      background: #141423;
      color: #fff;
      text-align: center;
    }
    .leaderboard-list {
      max-height: 120px;
      overflow-y: auto;
      width: 80%;
      text-align: left;
      font-size: 0.9rem;
      color: #aaa;
    }
    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
  </style>
</head>
<body>

  <div class="hud">
    <span>SCORE: <span id="score">0</span></span>
    <span>HIGH: <span id="highscore">0</span></span>
  </div>

  <div id="game-container">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    
    <div id="overlay" class="controls-overlay">
      <h1 style="color: #00ffcc;">SNAKE GAME</h1>
      <input type="text" id="username" placeholder="Enter Username" maxlength="12" />
      <button id="start-btn" onclick="startGame()">PLAY</button>
      
      <div style="width: 100%; text-align: center; margin-top: 10px;">
        <h3 style="color: #00ffcc;">GLOBAL LEADERBOARD</h3>
        <ul id="leaderboard" class="leaderboard-list"></ul>
      </div>
    </div>
  </div>

  <script>
    // --- SUPABASE SETUP ---
    const SUPABASE_URL = "https://eenolwhmmyhlakkyspem.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlbm9sd2htbXlobGFra3lzcGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzE1NTcsImV4cCI6MjEwMzg0NzU1N30.Bt1vPlikcK09k8zk-5Ga8sFY6aVNH9IfinLm3vm-uHk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- GAME ENGINE ---
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    const grid = 20;
    const tileCount = canvas.width / grid;

    let snake = [{x: 10, y: 10}];
    let dx = 1, dy = 0;
    let food = {x: 15, y: 15};
    let score = 0;
    let highScore = 0;
    let gameLoop = null;
    let isRunning = false;

    // Load Highscore & Leaderboard on startup
    fetchLeaderboard();

    document.addEventListener("keydown", changeDirection);

    function startGame() {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("Please enter a username to track your score!");
        return;
      }

      document.getElementById("overlay").style.display = "none";
      snake = [{x: 10, y: 10}];
      dx = 1; dy = 0;
      score = 0;
      document.getElementById("score").innerText = score;
      isRunning = true;
      
      spawnFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function update() {
      if (!isRunning) return;

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall Collision Check
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      // Self Collision Check
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Food Collision Check
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = "#141423";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Snake
      ctx.fillStyle = "#00ffcc";
      snake.forEach((segment, index) => {
        ctx.fillRect(segment.x * grid, segment.y * grid, grid - 2, grid - 2);
      });

      // Draw Food
      ctx.fillStyle = "#ff0055";
      ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function changeDirection(event) {
      if (!isRunning) return;
      const keyPressed = event.key;
      if ((keyPressed === "ArrowLeft" || keyPressed === "a") && dx === 0) { dx = -1; dy = 0; }
      if ((keyPressed === "ArrowUp" || keyPressed === "w") && dy === 0) { dx = 0; dy = -1; }
      if ((keyPressed === "ArrowRight" || keyPressed === "d") && dx === 0) { dx = 1; dy = 0; }
      if ((keyPressed === "ArrowDown" || keyPressed === "s") && dy === 0) { dx = 0; dy = 1; }
    }

    async function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);

      const username = document.getElementById("username").value.trim();
      if (score > highScore) {
        highScore = score;
        document.getElementById("highscore").innerText = highScore;
      }

      // Save Score to Supabase
      if (username && score > 0) {
        await saveScoreToSupabase(username, score);
      }

      await fetchLeaderboard();
      document.getElementById("overlay").style.display = "flex";
    }

    // --- SUPABASE API CALLS ---
    async function saveScoreToSupabase(username, finalScore) {
      try {
        const { error } = await supabaseClient
          .from('leaderboard')
          .insert([{ username: username, score: finalScore }]);
        if (error) console.error("Error saving score:", error);
      } catch (err) {
        console.error("Supabase connection error:", err);
      }
    }

    async function fetchLeaderboard() {
      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('username, score')
          .order('score', { ascending: false })
          .limit(5);

        if (error) throw error;

        const listContainer = document.getElementById("leaderboard");
        listContainer.innerHTML = "";

        if (data && data.length > 0) {
          data.forEach(entry => {
            const li = document.createElement("li");
            li.innerHTML = `<span>${entry.username}</span> <span>${entry.score}</span>`;
            listContainer.appendChild(li);
          });
        } else {
          listContainer.innerHTML = "<li>No high scores yet!</li>";
        }
      } catch (err) {
        console.error("Error fetching leaderboard:", err);
      }
    }
  </script>
</body>
</html>
